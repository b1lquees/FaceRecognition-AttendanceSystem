name: Tests

on: [push, pull_request]

jobs:
  test:
    # Both, because every CI failure this project has had was a difference between them
    # rather than a broken test: a module importable under `python -m pytest` but not
    # under `pytest`, a path separator that is a separator on one and a filename
    # character on the other, and a system library present on one by default. Development
    # happens on Windows and deployment on Linux, so testing one of them tests half.
    #
    # fail-fast is off so a failure on one platform still reports the other. Knowing
    # whether a break is platform-specific or universal is most of the diagnosis.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # opencv-python links against libGL and libglib, which are not installed on the
      # bare Ubuntu runner -- without these, `import cv2` fails at test collection.
      # Windows ships the equivalent, so this step is skipped there.
      - name: Install system libraries for OpenCV
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # installed separately: its metadata requires the source-only `dlib`
          # distribution, which needs CMake and a C++ toolchain to build.
          # dlib-bin (in requirements.txt) already provides the `dlib` import.
          pip install --no-deps face-recognition==1.3.0
          # registers the attendance package so `import attendance` resolves from any
          # directory. --no-deps because requirements.txt above already installed
          # everything; pyproject.toml declares the package, not the dependencies.
          pip install -e . --no-deps

      # `pytest`, not `python -m pytest`. The -m form puts the current directory on
      # sys.path, which hides import mistakes that then only appear here.
      - name: Run tests
        run: pytest -v
