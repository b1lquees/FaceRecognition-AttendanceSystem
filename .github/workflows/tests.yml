name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # opencv-python links against libGL and libglib, which are not installed on
      # the bare runner -- without these, `import cv2` fails at test collection
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # installed separately: its metadata requires the source-only `dlib`
          # distribution, which needs CMake and a C++ toolchain to build.
          # dlib-bin (in requirements.txt) already provides the `dlib` import.
          pip install --no-deps face-recognition==1.3.0
          # registers the attendance package so `import attendance` resolves from any
          # directory. --no-deps because requirements.txt above already installed
          # everything; pyproject.toml declares the package, not the dependencies.
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -v
