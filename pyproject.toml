[build-system]
# 77 rather than 61 because that is the first release to understand the PEP 639
# `license = "MIT"` SPDX string and `license-files` below. An older setuptools reads the
# string as the deprecated free-text form and drops the LICENSE file from the built
# distribution, which is the one thing the MIT licence requires us to ship.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance"
version = "0.1.0"
description = "Face recognition attendance system"
requires-python = ">=3.12"

# MIT covers the code in this repository only. The anti-spoofing weights under
# attendance/models/ are a separate work under Apache 2.0 and carry their own licence
# text, which is why both files are listed -- a wheel has to ship the terms for
# everything inside it, not just for the part we wrote.
license = "MIT"
license-files = ["LICENSE", "attendance/models/LICENSE-antispoof.txt"]

# Dependencies are deliberately NOT listed here.
#
# face-recognition has to be installed with --no-deps, because its metadata requires the
# source-only `dlib` distribution while the project actually uses the prebuilt dlib-bin
# wheel. A [project.dependencies] list cannot express "install this one without its
# dependencies", so requirements.txt stays the single source of truth for what to
# install, and this file only declares the package itself.
#
# What `pip install -e .` buys us: `import attendance` resolves from any working
# directory. Without it, a script in scripts/ could not import the package at all,
# because Python puts the *script's own* directory on sys.path, not the project root.
dependencies = []

[tool.setuptools]
# listed explicitly rather than auto-discovered, so a stray top-level directory never
# gets silently packaged
packages = ["attendance", "attendance.routes"]

# templates, stylesheets and the anti-spoofing model are not .py, so they need naming or
# they would be left out of a real (non-editable) install. The .onnx weights especially:
# liveness.py resolves them relative to its own __file__, so an install that omits them
# imports fine and then fails the first time somebody stands in front of the camera. The
# licence text travels with the weights because Apache 2.0 requires it to.
[tool.setuptools.package-data]
attendance = [
    "templates/*.html",
    "static/*.css",
    "models/*.onnx",
    "models/LICENSE-*.txt",
]

# moved here from pytest.ini -- one less config file at the root. pythonpath is gone on
# purpose: the tests now import the installed package, so a packaging mistake fails the
# suite instead of being hidden by a path hack.
[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W  pycodestyle  - layout mistakes
# F    pyflakes     - actual problems: unused imports, undefined names, shadowing
# I    isort        - import order, so it stops being a matter of opinion in review
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# These two predate the rest of the project and are written in a deliberately heavy
# teaching-comment style, with explanations running well past the line limit. Reflowing
# them would rewrite the author's own notes to satisfy a linter, which is the wrong way
# round. Everything else is held to the limit.
"scripts/webcam_test.py" = ["E501", "E702"]
"scripts/build_encodings.py" = ["E501"]
